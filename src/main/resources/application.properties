# =============================================================================
# SWIM FF-ICE Consumer - Common Configuration (All Profiles)
# =============================================================================

quarkus.application.name=swim-ffice-consumer
swim.service.name=ffice
swim.subscriptions=${ffice.subscriptions:[]}
swim.subscriptions.command-type=com.github.swim_developer.domain.model.command.SubscriptionCommand

# =============================================================================
# MongoDB Configuration
# =============================================================================
quarkus.mongodb.database=${MONGODB_DATABASE:swim-ffice}
quarkus.mongodb.max-pool-size=${MONGODB_MAX_POOL_SIZE:50}
quarkus.mongodb.min-pool-size=${MONGODB_MIN_POOL_SIZE:5}
quarkus.mongodb.max-connection-idle-time=60s
quarkus.mongodb.connect-timeout=10s
quarkus.mongodb.read-timeout=60s
quarkus.mongodb.server-selection-timeout=10000
quarkus.mongodb.health.enabled=false

# =============================================================================
# SWIM Providers (Multi-Provider Support)
# =============================================================================
swim.providers=${SWIM_PROVIDERS:[{"providerId":"default","subscriptionManager":{"url":"http://localhost:8081","tls":null,"resilience":{"connectTimeoutMs":0,"readTimeoutMs":0,"retryMaxAttempts":0,"retryDelayMs":0}},"amqpBroker":{"host":"localhost","port":5672,"sslEnabled":false,"username":"admin","password":"admin","tls":null}}]}

# =============================================================================
# Subscriptions
# =============================================================================
ffice.subscriptions.delete-and-recreate=${SUBSCRIPTIONS_DELETE_AND_RECREATE:true}
swim.subscriptions.delete-and-recreate=${SUBSCRIPTIONS_DELETE_AND_RECREATE:true}

# =============================================================================
# Reconciliation
# =============================================================================
reconciliation.retry.interval=${RECONCILIATION_RETRY_INTERVAL:10s}
reconciliation.retry.initial-delay=${RECONCILIATION_RETRY_INITIAL_DELAY:30s}
swim.subscription.filter-cache.refresh-interval-cycles=${SWIM_FILTER_CACHE_REFRESH_CYCLES:0}

# =============================================================================
# Subscription Renewal
# =============================================================================
swim.subscription.renewal.enabled=${SWIM_RENEWAL_ENABLED:true}
swim.subscription.renewal.check-interval=${SWIM_RENEWAL_CHECK_INTERVAL:5m}
swim.subscription.renewal.threshold=${SWIM_RENEWAL_THRESHOLD:1h}
swim.subscription.renewal.retry-count=${SWIM_RENEWAL_RETRY_COUNT:3}

# =============================================================================
# Validation
# =============================================================================
swim.validation.enabled=${SWIM_VALIDATION_ENABLED:true}
swim.validation.fail-on-nullbody=${SWIM_VALIDATION_FAIL_ON_NULLBODY:false}

# =============================================================================
# Kafka Configuration
# =============================================================================
kafka.batch.size=${KAFKA_BATCH_SIZE:65536}
kafka.linger.ms=${KAFKA_LINGER_MS:5}
kafka.buffer.memory=${KAFKA_BUFFER_MEMORY:67108864}

# =============================================================================
# Kafka Outgoing Channels
# =============================================================================
mp.messaging.outgoing.out-events.connector=smallrye-kafka
mp.messaging.outgoing.out-events.topic=ffice-events-topic
mp.messaging.outgoing.out-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.out-events.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.out-events.compression.type=lz4
mp.messaging.outgoing.out-events.acks=1
mp.messaging.outgoing.out-events.max-inflight-messages=${KAFKA_MAX_INFLIGHT:0}
mp.messaging.outgoing.out-events.buffer-size=${KAFKA_BUFFER_SIZE:2048}
mp.messaging.outgoing.out-events.waitForWriteCompletion=false
mp.messaging.outgoing.out-events.tracing-enabled=true

mp.messaging.outgoing.out-dlq.connector=smallrye-kafka
mp.messaging.outgoing.out-dlq.topic=ffice-events-dlq-topic
mp.messaging.outgoing.out-dlq.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.out-dlq.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.out-dlq.compression.type=lz4
mp.messaging.outgoing.out-dlq.acks=1
mp.messaging.outgoing.out-dlq.max-inflight-messages=${KAFKA_MAX_INFLIGHT:0}
mp.messaging.outgoing.out-dlq.buffer-size=${KAFKA_BUFFER_SIZE:2048}
mp.messaging.outgoing.out-dlq.waitForWriteCompletion=false
mp.messaging.outgoing.out-dlq.tracing-enabled=true

mp.messaging.outgoing.out-flight-plan.connector=smallrye-kafka
mp.messaging.outgoing.out-flight-plan.topic=ffice-flight-plan-topic
mp.messaging.outgoing.out-flight-plan.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.out-flight-plan.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.out-flight-plan.compression.type=lz4
mp.messaging.outgoing.out-flight-plan.acks=1

mp.messaging.outgoing.out-flight-update.connector=smallrye-kafka
mp.messaging.outgoing.out-flight-update.topic=ffice-flight-update-topic
mp.messaging.outgoing.out-flight-update.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.out-flight-update.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.out-flight-update.compression.type=lz4
mp.messaging.outgoing.out-flight-update.acks=1

mp.messaging.outgoing.out-operations.connector=smallrye-kafka
mp.messaging.outgoing.out-operations.topic=ffice-operations-topic
mp.messaging.outgoing.out-operations.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.out-operations.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.out-operations.compression.type=lz4
mp.messaging.outgoing.out-operations.acks=1

mp.messaging.outgoing.out-trial.connector=smallrye-kafka
mp.messaging.outgoing.out-trial.topic=ffice-trial-topic
mp.messaging.outgoing.out-trial.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.out-trial.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.out-trial.compression.type=lz4
mp.messaging.outgoing.out-trial.acks=1

mp.messaging.outgoing.out-submission.connector=smallrye-kafka
mp.messaging.outgoing.out-submission.topic=ffice-submission-topic
mp.messaging.outgoing.out-submission.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.out-submission.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.out-submission.compression.type=lz4
mp.messaging.outgoing.out-submission.acks=1

mp.messaging.outgoing.out-data.connector=smallrye-kafka
mp.messaging.outgoing.out-data.topic=ffice-data-topic
mp.messaging.outgoing.out-data.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.out-data.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.out-data.compression.type=lz4
mp.messaging.outgoing.out-data.acks=1

mp.messaging.outgoing.out-ffice-dlq.connector=smallrye-kafka
mp.messaging.outgoing.out-ffice-dlq.topic=ffice-dlq-topic
mp.messaging.outgoing.out-ffice-dlq.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.out-ffice-dlq.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.out-ffice-dlq.compression.type=lz4
mp.messaging.outgoing.out-ffice-dlq.acks=1

# =============================================================================
# Kafka Inbox Store
# =============================================================================
mp.messaging.outgoing.swim-inbox.topic=${INBOX_TOPIC:ffice-inbox-topic}

# =============================================================================
# Kafka Inbox Consumer
# =============================================================================
mp.messaging.incoming.in-ffice-inbox.connector=smallrye-kafka
mp.messaging.incoming.in-ffice-inbox.topic=${INBOX_TOPIC:ffice-inbox-topic}
mp.messaging.incoming.in-ffice-inbox.group.id=${INBOX_GROUP:ffice-inbox-consumer}
mp.messaging.incoming.in-ffice-inbox.batch=true
mp.messaging.incoming.in-ffice-inbox.auto.offset.reset=earliest
mp.messaging.incoming.in-ffice-inbox.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.in-ffice-inbox.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.in-ffice-inbox.failure-strategy=ignore
mp.messaging.incoming.in-ffice-inbox.commit-strategy=throttled
mp.messaging.incoming.in-ffice-inbox.auto.commit.interval.ms=${KAFKA_INBOX_COMMIT_INTERVAL:2000}
mp.messaging.incoming.in-ffice-inbox.max.poll.records=${KAFKA_INBOX_MAX_POLL:500}
mp.messaging.incoming.in-ffice-inbox.fetch.min.bytes=${KAFKA_INBOX_FETCH_MIN:1}
mp.messaging.incoming.in-ffice-inbox.fetch.max.wait.ms=${KAFKA_INBOX_FETCH_MAX_WAIT:100}
mp.messaging.incoming.in-ffice-inbox.concurrency=${KAFKA_INBOX_CONCURRENCY:20}
mp.messaging.incoming.in-ffice-inbox.tracing-enabled=true

# =============================================================================
# Per-Subscription Heartbeat Monitor
# =============================================================================
swim.heartbeat.monitor.enabled=true
swim.heartbeat.monitor.check-interval=15s
swim.heartbeat.monitor.tolerance=30s

# =============================================================================
# Jandex Index - External Modules
# =============================================================================
quarkus.index-dependency.fixm-ffice-model.group-id=com.github.swim-developer
quarkus.index-dependency.fixm-ffice-model.artifact-id=fixm-ffice-model
quarkus.index-dependency.swim-outbox-kafka-ffice.group-id=com.github.swim-developer
quarkus.index-dependency.swim-outbox-kafka-ffice.artifact-id=swim-outbox-kafka-ffice
quarkus.index-dependency.swim-inbox-store-kafka.group-id=com.github.swim-developer
quarkus.index-dependency.swim-inbox-store-kafka.artifact-id=swim-inbox-store-kafka
quarkus.index-dependency.swim-inbox-reader-kafka.group-id=com.github.swim-developer
quarkus.index-dependency.swim-inbox-reader-kafka.artifact-id=swim-inbox-reader-kafka

# =============================================================================
# SSL/TLS
# =============================================================================
quarkus.ssl.native=true

# =============================================================================
# REST Client
# =============================================================================
quarkus.rest-client.logging.scope=none
quarkus.rest-client.logging.body-limit=0

# =============================================================================
# Fault Tolerance
# =============================================================================
swim.subscription.api.timeout=${SWIM_SUBSCRIPTION_API_TIMEOUT:30000}
swim.subscription.api.max-retries=${SWIM_SUBSCRIPTION_API_MAX_RETRIES:3}
swim.subscription.api.retry-delay=${SWIM_SUBSCRIPTION_API_RETRY_DELAY:1000}
swim.subscription.api.max-duration=${SWIM_SUBSCRIPTION_API_MAX_DURATION:120000}

# =============================================================================
# Schedulers
# =============================================================================
swim.scheduler.initial-delay=${SWIM_SCHEDULER_INITIAL_DELAY:30s}

# =============================================================================
# AMQP Batch
# =============================================================================
swim.amqp.max-buffered-messages=${SWIM_AMQP_MAX_BUFFERED_MESSAGES:50}
swim.inbox.batch.size=${INBOX_BATCH_SIZE:50}
swim.inbox.batch.flush-interval-ms=${INBOX_BATCH_FLUSH_MS:50}

# =============================================================================
# Outbox Recovery
# =============================================================================
swim.outbox.recovery.interval=${SWIM_OUTBOX_RECOVERY_INTERVAL:30s}
swim.outbox.recovery.batch-size=${SWIM_OUTBOX_RECOVERY_BATCH_SIZE:100}
swim.outbox.cleanup.interval=${SWIM_OUTBOX_CLEANUP_INTERVAL:5m}
swim.outbox.cleanup.batch-size=${SWIM_OUTBOX_CLEANUP_BATCH_SIZE:500}
swim.outbox.max-retries=${SWIM_OUTBOX_MAX_RETRIES:5}

# =============================================================================
# Idempotency Cache
# =============================================================================
swim.idempotency.cache-name=processed-messages
quarkus.cache.caffeine."processed-messages".maximum-size=${SWIM_IDEMPOTENCY_CACHE_SIZE:100000}
quarkus.cache.caffeine."processed-messages".expire-after-write=${SWIM_IDEMPOTENCY_CACHE_TTL:24H}
quarkus.cache.caffeine."processed-messages".metrics-enabled=true

# =============================================================================
# OpenAPI
# =============================================================================
quarkus.smallrye-openapi.path=/openapi
quarkus.smallrye-openapi.management.enabled=false
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.always-include=true
mp.openapi.extensions.smallrye.info.title=SWIM FF-ICE Consumer API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Internal API for managing FF-ICE subscriptions and messages
mp.openapi.extensions.smallrye.info.contact.name=SWIM Developer Team

# =============================================================================
# Vert.x / Threading
# =============================================================================
quarkus.vertx.prefer-native-transport=true
quarkus.vertx.max-worker-execute-time=30s
quarkus.vertx.worker-pool-size=${VERTX_WORKER_POOL_SIZE:100}
quarkus.virtual-threads.enabled=false
quarkus.thread-pool.max-threads=${THREAD_POOL_MAX_THREADS:250}
quarkus.thread-pool.queue-size=1000
quarkus.banner.enabled=true

# =============================================================================
# Logging
# =============================================================================
quarkus.log.level=INFO
quarkus.log.category."com.github.swim_developer".level=INFO
quarkus.log.category."io.quarkus".level=INFO
quarkus.log.category."org.apache.kafka".level=WARN
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%c] (%t) %s%e%n
quarkus.log.console.async.enabled=true
quarkus.log.console.async.queue-length=10000
quarkus.log.console.async.overflow=DISCARD

# =============================================================================
# OpenTelemetry
# =============================================================================
quarkus.otel.enabled=${OTEL_ENABLED:true}
quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:false}
quarkus.otel.exporter.otlp.endpoint=${OTEL_ENDPOINT:http://localhost:4317}
quarkus.otel.exporter.otlp.headers=${OTEL_HEADERS:}
quarkus.otel.resource.attributes=service.name=swim-ffice-consumer,service.version=1.0.0,k8s.namespace.name=${POD_NAMESPACE:unknown}

# =============================================================================
# Prometheus Metrics
# =============================================================================
quarkus.management.enabled=true
quarkus.micrometer.enabled=${PROMETHEUS_ENABLED:true}
quarkus.micrometer.export.prometheus.enabled=${PROMETHEUS_ENABLED:true}
quarkus.micrometer.export.prometheus.path=/q/metrics
